<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHOC Service Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#21232A; --ink-soft:#5B5D63; --ink-faint:#8B8D93;
    --paper:#F6F4EE; --card:#FFFFFF;
    --border:#E1DDD1; --border-strong:#CBC5B4;
    --sidebar-bg:#1B1D21; --sidebar-text:#C9CAD1; --sidebar-text-dim:#75777E;
    --sidebar-active:#282B31;
    --brick:#B3402F; --brick-dark:#7E2C20; --brick-light:#F3E3E0;
    --steel:#3F5A6E; --steel-light:#E7EEF2;
    --amber:#A9701E; --amber-light:#F5EAD6;
    --mono:'IBM Plex Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); font-size:14px;}
  a{color:inherit;}

  /* ---------- layout ---------- */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
    display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px 14px; border-bottom:1px solid #303339;}
  .sidebar-header .mark{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--brick); text-transform:uppercase;}
  .sidebar-header h1{font-family:var(--display); font-weight:600; font-size:17px; margin:6px 0 2px; color:#F3F1EA; line-height:1.25;}
  .sidebar-header .sub{font-size:11.5px; color:var(--sidebar-text-dim);}

  .nav{list-style:none; margin:0; padding:10px; flex:1;}
  .nav li{margin-bottom:2px;}
  .nav a{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px;
    text-decoration:none; color:var(--sidebar-text); font-size:13.5px; font-weight:500;
    cursor:pointer; transition:background .12s ease;
  }
  .nav a:hover{background:var(--sidebar-active);}
  .nav a.active{background:var(--brick); color:#fff;}
  .nav a.disabled{color:var(--sidebar-text-dim); cursor:default;}
  .nav a.disabled:hover{background:transparent;}
  .nav svg{flex-shrink:0; width:17px; height:17px;}
  .soon{margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--sidebar-text-dim); border:1px solid #3A3D44; padding:2px 5px; border-radius:4px;}

  .sidebar-footer{padding:14px 20px; border-top:1px solid #303339; font-size:10.5px; color:var(--sidebar-text-dim); line-height:1.5;}

  .main{margin-left:236px; flex:1; min-width:0; padding:28px 34px 60px;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .topbar h2{font-family:var(--display); font-weight:600; font-size:23px; margin:0 0 4px;}
  .topbar .desc{color:var(--ink-soft); font-size:13px; max-width:560px;}
  .topbar-actions{display:flex; gap:8px;}

  .banner{
    display:flex; align-items:center; gap:8px; background:var(--amber-light); color:var(--amber);
    border:1px solid #E4CB9C; padding:9px 14px; border-radius:var(--radius); font-size:12.5px; margin-bottom:18px;
  }
  .banner svg{width:15px; height:15px; flex-shrink:0;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--body); font-size:13px; font-weight:500; padding:8px 14px; border-radius:6px;
    border:1px solid var(--border-strong); background:var(--card); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:all .12s ease;
  }
  .btn:hover{border-color:var(--ink-faint); background:#FBFAF7;}
  .btn-primary{background:var(--brick); border-color:var(--brick); color:#fff;}
  .btn-primary:hover{background:var(--brick-dark); border-color:var(--brick-dark);}
  .btn-ghost{border-color:transparent; background:transparent; padding:6px 8px;}
  .btn-ghost:hover{background:var(--border); }
  .btn-danger{color:#8C2A22;}
  .btn svg{width:14px; height:14px;}
  .btn-sm{padding:5px 9px; font-size:12px;}

  /* ---------- table ---------- */
  .table-wrap{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:600; padding:11px 14px; border-bottom:1px solid var(--border); background:#FBFAF6; position:sticky; top:0;
  }
  thead th.num, td.num{text-align:right;}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.row-item:hover{background:#FBFAF6;}
  td.num, td.mono{font-family:var(--mono); font-size:12.5px;}
  td.total{font-family:var(--mono); font-weight:500; color:var(--brick-dark);}
  tr.group-start td{border-top:2px solid var(--border-strong);}

  tr.row-header td{background:var(--steel-light); color:var(--steel); font-family:var(--display); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; padding:8px 14px;}
  tr.row-note td{background:#FBF8F0; font-style:italic; color:var(--ink-soft); font-size:12.5px; padding:10px 14px;}
  tr.row-note .chip{font-style:normal;}

  .chip{
    display:inline-block; font-family:var(--mono); font-size:11px; font-weight:500; padding:2px 8px;
    border-radius:20px; border:1px solid var(--border-strong); background:#FBFAF6; color:var(--ink-soft); white-space:nowrap;
  }
  .chip-out{background:var(--brick-light); border-color:#DBB4AC; color:var(--brick-dark);}

  .actions-cell{display:flex; gap:4px; justify-content:flex-end;}

  .empty-hint{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}

  /* ---------- coming soon page ---------- */
  .coming-soon{
    background:var(--card); border:1px dashed var(--border-strong); border-radius:12px;
    padding:60px 30px; text-align:center; color:var(--ink-soft);
  }
  .coming-soon svg{width:34px; height:34px; margin-bottom:12px; color:var(--ink-faint);}
  .coming-soon h3{font-family:var(--display); font-weight:600; font-size:16px; color:var(--ink); margin:0 0 6px;}
  .coming-soon p{font-size:13px; max-width:380px; margin:0 auto;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,18,15,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:12px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-header h3{font-family:var(--display); font-size:15px; font-weight:600; margin:0;}
  .modal-body{padding:18px 20px;}
  .modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    font-family:var(--body); font-size:13px; padding:8px 10px; border:1px solid var(--border-strong);
    border-radius:6px; background:#FCFBF8; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px; font-family:var(--body);}
  .checkbox-row{display:flex; align-items:center; gap:8px; grid-column:1/-1;}
  .checkbox-row label{font-size:12.5px; color:var(--ink-soft); font-weight:500; text-transform:none; letter-spacing:0;}

  @media (max-width: 860px){
    .sidebar{transform:translateX(-100%); transition:transform .18s ease; z-index:40;}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0; padding:20px 16px 50px;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="mark">Fixed Operations</div>
      <h1>IHOC Service Manual</h1>
      <div class="sub">Interstate Honda &middot; internal use only</div>
    </div>
    <ul class="nav" id="navList"></ul>
    <div class="sidebar-footer">
      Restricted to shop network.<br>IP allowlist not yet enforced.
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add row</h3>
      <button class="btn btn-ghost" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRow()">Save row</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   CONFIG
   ================================================================
   Point this at your deployed Cloudflare Worker once it's live.
   Until then (or whenever the Worker is unreachable) the app falls
   back to the read/write-in-memory demo dataset below so the UI is
   fully clickable without a backend.
*/
const CONFIG = {
  API_BASE: 'https://ihoc-service-manual-api.whitakerm56.workers.dev/api'
};

/* ================================================================
   PAGES
   ================================================================ */
const PAGES = [
  { id:'pricing',   label:'Pricing Guide',            icon:'tag',      ready:true  },
  { id:'mmcodes',   label:'Maintenance Minder Codes',  icon:'checklist',ready:false },
  { id:'vendors',   label:'Vendors',                   icon:'truck',    ready:false },
  { id:'oilguide',  label:'Oil Application Guide',     icon:'droplet',  ready:false },
  { id:'phones',    label:'Phone Extensions',          icon:'phone',    ready:false },
  { id:'process',   label:'Process Board',             icon:'flow',     ready:false },
  { id:'orgchart',  label:'Org Chart',                 icon:'sitemap',  ready:false },
  { id:'schedule',  label:'Employee Schedule',         icon:'calendar', ready:false },
];
const SETTINGS_PAGE = { id:'settings', label:'Settings', icon:'gear' };

const ICONS = {
  tag: '<path d="M3 11 11 3h7v7l-8 8a1.5 1.5 0 0 1-2 0l-5-5a1.5 1.5 0 0 1 0-2Z"/><circle cx="15" cy="7" r="1.4"/>',
  checklist: '<path d="M4 5h11M4 10h11M4 15h7"/><path d="M17.5 13.5 19 15l2.7-2.7"/>',
  truck: '<rect x="2.5" y="7" width="10.5" height="7.5" rx=".8"/><path d="M13 9.5H17l3 3v2H13z"/><circle cx="7" cy="16.5" r="1.6"/><circle cx="17" cy="16.5" r="1.6"/>',
  droplet: '<path d="M12 3.5S6 10.2 6 14.2a6 6 0 0 0 12 0C18 10.2 12 3.5 12 3.5Z"/>',
  phone: '<path d="M5 4.5h3l1.4 3.6-1.9 1.6a11 11 0 0 0 5.8 5.8l1.6-1.9 3.6 1.4v3a1 1 0 0 1-1.1 1C10.7 18.6 5.4 13.3 4 5.6A1 1 0 0 1 5 4.5Z"/>',
  flow: '<circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M7 6h5a3 3 0 0 1 3 3v0M7 18h5a3 3 0 0 0 3-3v0"/>',
  sitemap: '<rect x="9" y="3" width="6" height="4.2" rx=".7"/><rect x="2.5" y="16.8" width="6" height="4.2" rx=".7"/><rect x="9" y="16.8" width="6" height="4.2" rx=".7"/><rect x="15.5" y="16.8" width="6" height="4.2" rx=".7"/><path d="M12 7.2v4M5.5 16.8v-3h13v3"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M7.5 3v3M16.5 3v3"/>',
  gear: '<circle cx="12" cy="12" r="3.1"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7M18.1 18.1l-1.7-1.7M7.6 7.6 5.9 5.9"/>'
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

let currentPage = 'pricing';
let usingDemoData = false;
let pricingRows = [];
let editingId = null;

/* ================================================================
   NAV
   ================================================================ */
function renderNav(){
  const list = document.getElementById('navList');
  list.innerHTML = '';
  [...PAGES, {divider:true}, SETTINGS_PAGE].forEach(p => {
    if(p.divider){
      const li = document.createElement('li');
      li.style.cssText = 'height:1px;background:#303339;margin:8px 10px;';
      list.appendChild(li);
      return;
    }
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = (p.id === currentPage ? 'active ' : '') + (p.ready === false ? 'disabled' : '');
    a.innerHTML = icon(p.icon) + `<span>${p.label}</span>` + (p.ready === false ? '<span class="soon">soon</span>' : '');
    if(p.ready !== false){
      a.onclick = () => goTo(p.id);
    }
    li.appendChild(a);
    list.appendChild(li);
  });
}

function goTo(pageId){
  currentPage = pageId;
  renderNav();
  render();
  document.getElementById('sidebar').classList.remove('open');
}

/* ================================================================
   DATA
   ================================================================ */
async function loadPricing(){
  try{
    const res = await fetch(`${CONFIG.API_BASE}/pricing`);
    if(!res.ok) throw new Error('bad response');
    pricingRows = await res.json();
    usingDemoData = false;
  }catch(err){
    pricingRows = JSON.parse(JSON.stringify(SEED_DATA));
    usingDemoData = true;
  }
  pricingRows.sort((a,b) => a.sort_order - b.sort_order);
}

function fmtMoney(v){
  if(v === null || v === undefined || v === '') return '';
  return '$' + Number(v).toFixed(2);
}
function fmtHours(v){
  if(v === null || v === undefined || v === '') return '';
  return Number(v).toFixed(1);
}

/* ================================================================
   RENDER: PRICING GUIDE + SETTINGS share a table renderer
   ================================================================ */
function pricingTableHTML(editable){
  let prevMm = null;
  const rowsHtml = pricingRows.map(r => {
    if(r.row_type === 'header'){
      prevMm = null;
      return `<tr class="row-header"><td colspan="${editable?8:7}">${escapeHtml(r.description)}</td></tr>`;
    }
    if(r.row_type === 'note'){
      prevMm = null;
      const chip = r.mm_code ? `<span class="chip">${escapeHtml(r.mm_code)}</span> ` : '';
      const editCell = editable ? `<td class="actions-cell">${actionButtons(r.id)}</td>` : '';
      return `<tr class="row-note"><td colspan="${editable?7:7}">${chip}${escapeHtml(r.description)}</td>${editCell}</tr>`;
    }
    const groupStart = r.mm_code && r.mm_code !== prevMm;
    if(r.mm_code) prevMm = r.mm_code;
    const mm = r.mm_code ? `<span class="chip">${escapeHtml(r.mm_code)}</span>` : '';
    const parts = r.price_out ? `<span class="chip chip-out">Price out</span>` : fmtMoney(r.total_parts);
    const editCell = editable ? `<td class="actions-cell">${actionButtons(r.id)}</td>` : '';
    return `<tr class="row-item${groupStart?' group-start':''}">
      <td class="mono">${mm}</td>
      <td>${escapeHtml(r.description)}${r.timing_type ? ` <span class="chip">${escapeHtml(r.timing_type)}</span>`:''}</td>
      <td class="num">${fmtHours(r.labor_hours)}</td>
      <td class="num">${fmtMoney(r.labor_price)}</td>
      <td class="num">${fmtMoney(r.labor_rate)}</td>
      <td class="num">${parts}</td>
      <td class="num total">${fmtMoney(r.total_price)}</td>
      ${editCell}
    </tr>`;
  }).join('');

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>MM code</th><th>Description</th><th class="num">Labor hrs</th><th class="num">Labor $</th>
      <th class="num">Rate</th><th class="num">Parts</th><th class="num">Total</th>
      ${editable?'<th class="num">Actions</th>':''}
    </tr></thead>
    <tbody>${rowsHtml || `<tr><td colspan="8" class="empty-hint">No rows yet. Add the first one.</td></tr>`}</tbody>
  </table></div>`;
}

function actionButtons(id){
  return `<button class="btn btn-ghost btn-sm" onclick="openEdit('${id}')" aria-label="Edit">${icon('gear').replace('gear','')}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M4 20l1-4 11-11 3 3-11 11-4 1Z"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteRow('${id}')" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/></svg></button>`;
}

function demoBanner(){
  if(!usingDemoData) return '';
  return `<div class="banner">${icon('gear').replace(/<[^>]+gear[^>]*>/,'')}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px;flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    Demo mode — the Worker at <code style="font-family:var(--mono)">${CONFIG.API_BASE}</code> isn't reachable, so this is showing the original spreadsheet data in memory. Edits here won't be saved until the Worker + Supabase are connected.</div>`;
}

/* ================================================================
   PAGE: Pricing Guide
   ================================================================ */
function renderPricingPage(){
  return `
    <div class="topbar">
      <div>
        <h2>Pricing guide</h2>
        <div class="desc">Labor, parts, and total pricing for every standard service operation.</div>
      </div>
    </div>
    ${demoBanner()}
    ${pricingTableHTML(false)}
  `;
}

/* ================================================================
   PAGE: Settings (pricing guide CRUD, page 1)
   ================================================================ */
function renderSettingsPage(){
  return `
    <div class="topbar">
      <div>
        <h2>Settings</h2>
        <div class="desc">Add, edit, or remove entries. Currently managing the Pricing Guide — the same pattern will extend to every other page as it's built.</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openAdd()">${icon('tag').replace('tag','').replace('<circle','')}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg> Add row</button>
      </div>
    </div>
    ${demoBanner()}
    ${pricingTableHTML(true)}
  `;
}

/* ================================================================
   PAGE: Coming soon
   ================================================================ */
function renderComingSoon(page){
  return `
    <div class="topbar"><div><h2>${page.label}</h2></div></div>
    <div class="coming-soon">
      ${icon(page.icon)}
      <h3>Not built yet</h3>
      <p>${page.label} is next up in the build queue. It'll appear here — and in the sidebar as a live link — once its table and Worker routes are ready.</p>
    </div>
  `;
}

/* ================================================================
   MAIN RENDER
   ================================================================ */
async function render(){
  const main = document.getElementById('main');
  if(currentPage === 'pricing'){
    if(pricingRows.length === 0) await loadPricing();
    main.innerHTML = renderPricingPage();
  } else if(currentPage === 'settings'){
    if(pricingRows.length === 0) await loadPricing();
    main.innerHTML = renderSettingsPage();
  } else {
    const page = PAGES.find(p => p.id === currentPage);
    main.innerHTML = renderComingSoon(page);
  }
}

/* ================================================================
   MODAL / CRUD
   ================================================================ */
function emptyRow(){
  return { row_type:'item', timing_type:'', mm_code:'', description:'', labor_hours:'', labor_price:'', labor_rate:'', total_parts:'', price_out:false, total_price:'' };
}

function openAdd(){
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add row';
  document.getElementById('modalBody').innerHTML = modalFormHTML(emptyRow());
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(id){
  const row = pricingRows.find(r => r.id === id);
  if(!row) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit row';
  document.getElementById('modalBody').innerHTML = modalFormHTML(row);
  document.getElementById('modalOverlay').classList.add('open');
  toggleFieldVisibility();
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

function modalFormHTML(r){
  return `
    <div class="field-row">
      <div class="field">
        <label>Row type</label>
        <select id="f_row_type" onchange="toggleFieldVisibility()">
          <option value="item" ${r.row_type==='item'?'selected':''}>Item (priced row)</option>
          <option value="header" ${r.row_type==='header'?'selected':''}>Section header</option>
          <option value="note" ${r.row_type==='note'?'selected':''}>Note (policy text)</option>
        </select>
      </div>
      <div class="field" id="wrap_mm_code">
        <label>MM code / label</label>
        <input type="text" id="f_mm_code" value="${escapeAttr(r.mm_code)}" placeholder="e.g. A1 or B1, WIPERS">
      </div>
    </div>
    <div class="field-row">
      <div class="field full" id="wrap_description">
        <label>Description</label>
        <textarea id="f_description" placeholder="Operation description, header text, or note">${escapeHtml(r.description||'')}</textarea>
      </div>
    </div>
    <div class="field-row" id="wrap_item_fields">
      <div class="field">
        <label>Timing type</label>
        <input type="text" id="f_timing_type" value="${escapeAttr(r.timing_type)}" placeholder="Chain / Belt (optional)">
      </div>

        <label>Labor hours</label>
        <input type="number" step="0.1" id="f_labor_hours" value="${r.labor_hours ?? ''}">
      </div>
      <div class="field">
        <label>Labor price</label>
        <input type="number" step="0.01" id="f_labor_price" value="${r.labor_price ?? ''}">
      </div>
      <div class="field">
        <label>Labor rate</label>
        <input type="number" step="0.01" id="f_labor_rate" value="${r.labor_rate ?? ''}">
      </div>
      <div class="field">
        <label>Total parts</label>
        <input type="number" step="0.01" id="f_total_parts" value="${r.total_parts ?? ''}">
      </div>
      <div class="field">
        <label>Total price</label>
        <input type="number" step="0.01" id="f_total_price" value="${r.total_price ?? ''}">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="f_price_out" ${r.price_out ? 'checked':''}>
        <label for="f_price_out">Price out (no fixed parts total — quoted at time of service)</label>
      </div>
    </div>
  `;
}

function toggleFieldVisibility(){
  const type = document.getElementById('f_row_type').value;
  document.getElementById('wrap_item_fields').style.display = type === 'item' ? 'grid' : 'none';
  document.getElementById('wrap_mm_code').style.display = type === 'header' ? 'none' : 'flex';
}

async function saveRow(){
  const row_type = document.getElementById('f_row_type').value;
  const payload = {
    row_type,
    mm_code: type_or_null(document.getElementById('f_mm_code').value),
    description: document.getElementById('f_description').value.trim(),
  };
  if(row_type === 'item'){
    payload.timing_type = type_or_null(document.getElementById('f_timing_type').value);
    payload.labor_hours = numOrNull(document.getElementById('f_labor_hours').value);
    payload.labor_price = numOrNull(document.getElementById('f_labor_price').value);
    payload.labor_rate = numOrNull(document.getElementById('f_labor_rate').value);
    payload.total_parts = numOrNull(document.getElementById('f_total_parts').value);
    payload.price_out = document.getElementById('f_price_out').checked;
    payload.total_price = numOrNull(document.getElementById('f_total_price').value);
  }
  if(!payload.description){
    alert('Description is required.');
    return;
  }

  if(editingId){
    Object.assign(pricingRows.find(r => r.id === editingId), payload);
    if(!usingDemoData){
      try{ await fetch(`${CONFIG.API_BASE}/pricing/${editingId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }catch(e){}
    }
  } else {
    const newRow = { id: 'local-' + Date.now(), sort_order: (pricingRows.at(-1)?.sort_order || 0) + 10, ...payload };
    pricingRows.push(newRow);
    if(!usingDemoData){
      try{ await fetch(`${CONFIG.API_BASE}/pricing`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newRow)}); }catch(e){}
    }
  }
  closeModal();
  render();
}

async function deleteRow(id){
  if(!confirm('Delete this row? This can\'t be undone.')) return;
  pricingRows = pricingRows.filter(r => r.id !== id);
  if(!usingDemoData){
    try{ await fetch(`${CONFIG.API_BASE}/pricing/${id}`, {method:'DELETE'}); }catch(e){}
  }
  render();
}

function type_or_null(v){ v = (v||'').trim(); return v === '' ? null : v; }
function numOrNull(v){ return v === '' || v === null || v === undefined ? null : Number(v); }
function escapeHtml(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
