<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHOC Service Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EFEFEF; --ink-soft:#B2B4B8; --ink-faint:#7C7E83;
    --paper:#121213; --card:#1B1C1E;
    --border:#2C2D30; --border-strong:#3E4045;
    --sidebar-bg:#EBEBEC; --sidebar-text:#2A2B2D; --sidebar-text-dim:#8A8C90;
    --sidebar-active:#DCDCDD;
    --brick:#1E6FD9; --brick-dark:#7FB4F5; --brick-light:rgba(30,111,217,.16);
    --steel:#4FA8E8; --steel-light:rgba(0,113,206,.18);
    --amber:#E3A63E; --amber-light:rgba(169,112,30,.18);
    --mono:'IBM Plex Mono', monospace;
    --display:'Barlow Semi Condensed', sans-serif;
    --body:'Inter', sans-serif;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); font-size:14px;}
  a{color:inherit;}

  /* ---------- layout ---------- */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
    display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
  }
  .sidebar-header{padding:20px 20px 16px; border-bottom:1px solid #D6D6D7;}
  .sidebar-header .mark{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--brick); text-transform:uppercase; margin-bottom:10px;}
  .sidebar-header .logo{width:100%; height:auto; display:block; margin-bottom:8px;}
  .sidebar-header .sub{font-size:11.5px; color:var(--sidebar-text-dim);}

  .nav{list-style:none; margin:0; padding:10px; flex:1;}
  .nav li{margin-bottom:2px;}
  .nav a{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px;
    text-decoration:none; color:var(--sidebar-text); font-size:13.5px; font-weight:500;
    cursor:pointer; transition:background .12s ease;
  }
  .nav a:hover{background:var(--sidebar-active);}
  .nav a.active{background:var(--brick); color:#fff;}
  .nav a.disabled{color:var(--sidebar-text-dim); cursor:default;}
  .nav a.disabled:hover{background:transparent;}
  .nav svg{flex-shrink:0; width:17px; height:17px;}
  .soon{margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--sidebar-text-dim); border:1px solid #C6C6C8; padding:2px 5px; border-radius:4px;}

  .sidebar-footer{padding:14px 20px; border-top:1px solid #D6D6D7; font-size:10.5px; color:var(--sidebar-text-dim); line-height:1.5;}

  .main{margin-left:236px; flex:1; min-width:0; padding:28px 34px 60px;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .topbar h2{font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:.01em; text-transform:uppercase; margin:0 0 4px;}
  .topbar .desc{color:var(--ink-soft); font-size:13px; max-width:560px;}
  .topbar-actions{display:flex; gap:8px;}

  .banner{
    display:flex; align-items:center; gap:8px; background:var(--amber-light); color:var(--amber);
    border:1px solid #5C441C; padding:9px 14px; border-radius:var(--radius); font-size:12.5px; margin-bottom:18px;
  }
  .banner svg{width:15px; height:15px; flex-shrink:0;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--body); font-size:13px; font-weight:500; padding:8px 14px; border-radius:6px;
    border:1px solid var(--border-strong); background:var(--card); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:all .12s ease;
  }
  .btn:hover{border-color:var(--ink-faint); background:#232427;}
  .btn-primary{background:var(--brick); border-color:var(--brick); color:#fff;}
  .btn-primary:hover{background:var(--brick-dark); border-color:var(--brick-dark);}
  .btn-ghost{border-color:transparent; background:transparent; padding:6px 8px;}
  .btn-ghost:hover{background:var(--border); }
  .btn-danger{color:#8C2A22;}
  .btn svg{width:14px; height:14px;}
  .btn-sm{padding:5px 9px; font-size:12px;}

  /* ---------- sidebar search ---------- */
  .sidebar-search{padding:14px 16px; border-top:1px solid #D6D6D7;}
  .search-input-row{
    display:flex; align-items:center; gap:7px; background:#FFFFFF; border:1px solid #C9C9CA;
    border-radius:6px; padding:6px 9px; margin-bottom:7px;
  }
  .search-input-row svg{width:15px; height:15px; color:var(--sidebar-text-dim); flex-shrink:0;}
  .search-input-row input{
    flex:1; min-width:0; border:none; background:transparent; outline:none; font-family:var(--body);
    font-size:12.5px; color:var(--sidebar-text);
  }
  .search-input-row input::placeholder{color:var(--sidebar-text-dim);}
  .search-controls-row{display:flex; align-items:center; justify-content:space-between;}
  .search-count{font-family:var(--mono); font-size:11px; color:var(--sidebar-text-dim); white-space:nowrap;}
  .search-nav-btns{display:flex; gap:2px;}
  .search-nav-btns button{
    display:flex; align-items:center; justify-content:center; width:24px; height:24px; padding:0;
    border:none; background:transparent; border-radius:5px; color:var(--sidebar-text-dim); cursor:pointer;
  }
  .search-nav-btns button:hover{background:var(--sidebar-active); color:var(--sidebar-text);}
  .search-nav-btns svg{width:14px; height:14px;}
  mark.search-hit{background:#FFD54A; color:#1A1A1A; border-radius:2px; padding:0 1px;}
  mark.search-hit.current{background:var(--brick); color:#fff;}

  /* ---------- labor rates ---------- */
  .rate-cards{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .rate-card{flex:1; min-width:210px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px;}
  .rate-amount{font-family:var(--display); font-weight:700; font-size:28px; color:var(--brick);}
  .rate-per-hr{font-size:14px; font-weight:500; color:var(--ink-faint); margin-left:2px;}
  .rate-name{font-size:13px; font-weight:600; color:var(--ink); margin-top:4px;}
  .rate-note{font-size:11.5px; color:var(--ink-faint); margin-top:4px; line-height:1.4;}
  .rate-disclaimer{
    background:var(--amber-light); border:1px solid #5C441C; color:var(--amber);
    padding:10px 14px; border-radius:var(--radius); font-size:12.5px; margin-bottom:24px;
  }

  /* ---------- table ---------- */
  .table-wrap{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:600; padding:11px 14px; border-bottom:1px solid var(--border); background:#1A1B1D; position:sticky; top:0;
  }
  thead th.num, td.num{text-align:right;}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.row-item:hover{background:#212226;}
  td.num, td.mono{font-family:var(--mono); font-size:12.5px;}
  td.total{font-family:var(--mono); font-weight:500; color:var(--brick-dark);}
  tr.group-start td{border-top:2px solid var(--border-strong);}

  tr.row-header td{background:var(--steel-light); color:var(--steel); font-family:var(--display); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; padding:8px 14px;}
  tr.row-note td{background:#1E1B15; font-style:italic; color:var(--ink-soft); font-size:12.5px; padding:10px 14px;}
  tr.row-note .chip{font-style:normal;}

  .chip{
    display:inline-block; font-family:var(--mono); font-size:11px; font-weight:500; padding:2px 8px;
    border-radius:20px; border:1px solid var(--border-strong); background:#232427; color:var(--ink-soft); white-space:nowrap;
  }
  .chip-out{background:var(--brick-light); border-color:#2E5A96; color:var(--brick-dark);}

  .actions-cell{display:flex; gap:4px; justify-content:flex-end;}

  .empty-hint{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}

  /* ---------- maintenance minder page ---------- */
  .mm-explainer{
    background:var(--steel-light); color:var(--ink); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 16px; font-size:13px; line-height:1.55; margin-bottom:22px;
  }
  .mm-explainer strong{color:var(--steel); font-weight:600;}
  .section-label{
    font-family:var(--display); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-faint); margin:0 0 10px;
  }
  .mm-main-card{padding:18px 20px 20px; margin-bottom:26px;}
  .mm-main-head{display:flex; align-items:flex-start; gap:14px; padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--border);}
  .mm-letter-chip{font-family:var(--display); font-size:15px; font-weight:600; padding:5px 12px; flex-shrink:0; background:var(--brick-light); border-color:transparent; color:var(--brick-dark);}
  .mm-main-title{font-weight:600; font-size:15px; margin-bottom:2px;}
  .mm-main-sub{color:var(--ink-soft); font-size:12.5px;}
  .mm-checklist-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;}
  .mm-checklist-item{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink-soft); line-height:1.45;}
  .mm-checklist-item svg{width:15px; height:15px; margin-top:2px; color:var(--steel); flex-shrink:0;}
  .mm-number-chip{font-family:var(--display); font-weight:600; background:var(--steel-light); border-color:transparent; color:var(--steel);}

  /* ---------- employee schedule ---------- */
  .schedule-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px;}
  .schedule-month-label{font-family:var(--display); font-weight:600; font-size:17px; min-width:180px; text-align:center;}
  .schedule-grid-wrap{overflow-x:auto; margin-bottom:8px;}
  .schedule-grid{display:grid; grid-template-columns:repeat(6, minmax(150px, 1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; min-width:900px;}
  .schedule-head-cell{background:#1A1B1D; padding:9px 10px; text-align:left; font-family:var(--display); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint);}
  .schedule-day-cell{background:var(--card); padding:9px 10px; min-height:120px; display:flex; flex-direction:column; gap:5px;}
  .schedule-day-empty{background:var(--paper);}
  .schedule-day-today{box-shadow:inset 0 0 0 2px var(--brick);}
  .schedule-date-num{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-bottom:2px;}
  .schedule-person{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); line-height:1.35;}
  .schedule-person-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .schedule-none{font-size:10.5px; color:var(--ink-faint); font-style:italic;}

  /* ---------- org chart ---------- */
  .org-tree-scroll{overflow-x:auto; padding:4px 4px 16px;}
  .org-tree{display:flex; flex-direction:column; align-items:center; width:max-content; margin:0 auto;}
  .org-tree-branch{display:flex; flex-direction:column; align-items:center; position:relative;}
  .org-tree-branch::before{content:''; position:absolute; top:-26px; left:50%; width:2px; height:26px; background:var(--border-strong);}
  .org-tree > .org-tree-branch::before{display:none;}
  .org-tree-connector-down{width:2px; height:26px; background:var(--border-strong);}
  .org-tree-row{display:flex; gap:28px; flex-wrap:nowrap; justify-content:center; align-items:flex-start; border-top:2px solid var(--border-strong); padding-top:26px; position:relative; margin-top:0;}

  .person-card{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; width:150px; flex-shrink:0;}
  .person-avatar{border-radius:50%; object-fit:cover; border:2px solid var(--border-strong); flex-shrink:0;}
  .person-avatar-initials{display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; border-style:solid; border-width:2px;}
  .person-info{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .person-name-line{display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap;}
  .person-name{font-weight:600; font-size:13px; color:var(--ink); line-height:1.3;}
  .person-name-line .chip{font-size:9.5px; padding:1px 6px;}
  .person-title{font-size:11px; color:var(--ink-soft); line-height:1.3; margin-top:1px;}

  .org-dept-stack{width:230px;}
  .org-dept-stack-head{
    display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:600; font-size:12px;
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;
  }
  .org-dept-stack-list{
    display:flex; flex-direction:column; gap:4px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:8px; width:100%;
  }
  .person-row{display:flex; align-items:center; gap:10px; text-align:left; padding:5px 6px;}
  .person-row-info{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .person-row-name-line{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .person-row-name{font-weight:600; font-size:12px; color:var(--ink); white-space:nowrap;}
  .person-row-name-line .chip{font-size:9px; padding:1px 5px;}
  .person-row-title{font-weight:400; color:var(--ink-soft); font-size:11px; margin-top:1px;}

  .photo-upload-row{display:flex; align-items:center; gap:14px;}
  .photo-uploading{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--ink-faint); border:2px dashed var(--border-strong); text-align:center;}

  /* ---------- process board ---------- */
  .board-legend{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:12px;}
  .board-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .board-legend-dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .board-wrap{overflow-x:auto; margin-bottom:30px;}
  table.board-table{table-layout:fixed; min-width:1080px; border-collapse:separate; border-spacing:0;}
  .board-role-col{position:sticky; left:0; background:var(--card); width:130px; min-width:130px; text-align:left; z-index:1; padding:10px 12px;}
  thead .board-role-col{background:#1A1B1D; z-index:2;}
  .board-phase-col{width:190px; text-align:left; font-size:10.5px;}
  td.board-cell{vertical-align:top; padding:10px 8px; border-bottom:1px solid var(--border); border-left:1px solid var(--border); background:#17181A;}
  td.board-cell-empty{background:transparent;}
  .board-chip{
    background:var(--chip-color); border:1px solid var(--chip-color); border-radius:6px;
    padding:8px 10px; font-size:11.5px; line-height:1.4; font-weight:600; color:#191A1C;
  }
  .board-chip-connector{width:1px; height:8px; background:var(--border-strong); margin:2px auto;}
  .role-badge{
    display:inline-block; font-family:var(--display); font-weight:700; font-size:11.5px; padding:5px 12px;
    border-radius:6px; text-transform:uppercase; letter-spacing:.03em; color:#191A1C;
  }

  .tracker-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-bottom:30px;}
  .tracker-card{padding:16px 18px;}
  .tracker-head{margin-bottom:12px;}
  .tracker-name{font-family:var(--display); font-weight:600; font-size:15px;}
  .tracker-subtitle{font-size:12px; color:var(--ink-faint); font-style:italic; margin-top:2px;}
  .tracker-flow{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .tracker-step{background:#1E2023; border:1px solid var(--border-strong); border-radius:8px; padding:8px 11px; font-size:12px; color:var(--ink);}
  .tracker-arrow{width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;}

  .rules-list{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .rule-card{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--brick); border-radius:8px; padding:12px 16px;}
  .rule-number{font-family:var(--display); font-weight:600; font-size:13px; color:var(--brick); background:var(--brick-light); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rule-text{font-size:13.5px; line-height:1.5; color:var(--ink); padding-top:2px;}

  @media (max-width: 900px){
    .tracker-grid{grid-template-columns:1fr;}
  }

  /* ---------- oil application guide ---------- */
  .oil-legend{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:12px;}
  .oil-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .oil-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .oil-swatch.oil-30{background:#7A5A2E;}
  .oil-swatch.oil-20{background:#1F3A54;}
  .oil-swatch.oil-0{background:#1F4A32;}
  .oil-swatch.oil-alt-swatch{background:#4A4326; border:1px dashed #C9B25A;}
  .oil-matrix-wrap{overflow-x:auto; margin-bottom:26px;}
  table.oil-matrix{table-layout:fixed; min-width:1100px;}
  .oil-model-col{position:sticky; left:0; background:var(--card); width:150px; min-width:150px; text-align:left; font-weight:500; z-index:1;}
  thead .oil-model-col{background:#1A1B1D; z-index:2;}
  .oil-year-col{width:64px; text-align:center;}
  td.oil-cell{padding:6px 4px; text-align:center; border-bottom:1px solid var(--border); border-left:1px solid var(--border);}
  td.oil-empty{background:transparent;}
  td.oil-cell.oil-30{background:#3A2C16;}
  td.oil-cell.oil-20{background:#122336;}
  td.oil-cell.oil-0{background:#122A1C;}
  .oil-primary{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink);}
  .oil-alt{font-family:var(--mono); font-size:9.5px; color:#D9C56E; margin-top:2px;}
  .verify-badge{
    font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--amber); border:1px solid #5C441C; background:var(--amber-light); padding:2px 6px; border-radius:10px;
  }
  .fluid-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle;}
  .ink-faint-text{color:var(--ink-faint);}
  .settings-tabs-sub{margin-top:-8px; margin-bottom:16px; border-bottom:1px solid var(--border);}
  .settings-tabs-sub .settings-tab{font-size:12px; margin-right:14px; padding:6px 4px;}

  /* ---------- vendors page ---------- */
  .vendor-card{margin-bottom:18px;}
  .vendor-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 16px 14px; border-bottom:1px solid var(--border);}
  .vendor-name{font-family:var(--display); font-weight:600; font-size:16px;}
  .vendor-name-empty{color:var(--ink-faint); font-weight:500; font-style:italic;}
  .vendor-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .vendor-meta{display:flex; flex-wrap:wrap; gap:14px; margin-top:6px;}
  .vendor-meta-item{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);}
  .vendor-meta-item svg{width:14px; height:14px; color:var(--steel); flex-shrink:0;}

  /* ---------- extended warranty companies ---------- */
  .warranty-card{margin-bottom:18px;}
  .warranty-link{color:var(--steel); text-decoration:none; font-weight:500;}
  .warranty-link:hover{text-decoration:underline;}
  .warranty-body{padding:16px;}
  .warranty-cred-row{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border);}
  .warranty-cred{min-width:180px;}
  .warranty-cred-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; margin-bottom:4px;}
  .warranty-cred-value{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; color:var(--ink);}
  .warranty-cred-value .btn{padding:3px 8px; font-size:11px;}
  .warranty-password-mask{letter-spacing:1px;}
  .warranty-rate-row{display:flex; gap:16px; flex-wrap:wrap;}
  .warranty-rate-block{background:#17181A; border:1px solid var(--border); border-radius:8px; padding:10px 14px; min-width:150px;}
  .warranty-rate-suggested{background:var(--brick-light); border-color:#2E5A96;}
  .warranty-rate-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;}
  .warranty-rate-value{font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink); margin-top:2px;}
  .warranty-rate-suggested .warranty-rate-value{color:var(--brick-dark);}
  .warranty-rate-date{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .warranty-rate-note{font-size:10px; color:var(--brick-dark); margin-top:4px; line-height:1.35; max-width:180px;}
  .warranty-notes{margin-top:14px; font-size:12px; color:var(--ink-soft); font-style:italic;}

  /* ---------- settings tabs ---------- */
  .settings-tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .settings-tab{
    font-family:var(--body); font-size:13px; font-weight:500; color:var(--ink-faint); background:transparent;
    border:none; border-bottom:2px solid transparent; padding:9px 4px; margin-right:18px; cursor:pointer;
  }
  .settings-tab:hover{color:var(--ink-soft);}
  .settings-tab.active{color:var(--brick); border-bottom-color:var(--brick);}

  @media (max-width: 640px){
    .mm-checklist-grid{grid-template-columns:1fr;}
  }

  /* ---------- coming soon page ---------- */
  .coming-soon{
    background:var(--card); border:1px dashed var(--border-strong); border-radius:12px;
    padding:60px 30px; text-align:center; color:var(--ink-soft);
  }
  .coming-soon svg{width:34px; height:34px; margin-bottom:12px; color:var(--ink-faint);}
  .coming-soon h3{font-family:var(--display); font-weight:600; font-size:16px; color:var(--ink); margin:0 0 6px;}
  .coming-soon p{font-size:13px; max-width:380px; margin:0 auto;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:12px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-header h3{font-family:var(--display); font-size:15px; font-weight:600; margin:0;}
  .modal-body{padding:18px 20px;}
  .modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    font-family:var(--body); font-size:13px; padding:8px 10px; border:1px solid var(--border-strong);
    border-radius:6px; background:#1A1B1D; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px; font-family:var(--body);}
  .checkbox-row{display:flex; align-items:center; gap:8px; grid-column:1/-1;}
  .computed-preview{font-family:var(--mono); font-size:13px; color:var(--brick-dark); background:var(--brick-light); border:1px solid var(--border-strong); border-radius:6px; padding:9px 12px;}
  .workday-checks{display:flex; gap:12px; flex-wrap:wrap;}
  .workday-check{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--ink-soft); text-transform:none;}
  .checkbox-row label{font-size:12.5px; color:var(--ink-soft); font-weight:500; text-transform:none; letter-spacing:0;}

  @media (max-width: 860px){
    .sidebar{transform:translateX(-100%); transition:transform .18s ease; z-index:40;}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0; padding:20px 16px 50px;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>

/* ================================================================
   NAV
   ================================================================ */
function renderNav(){
  const list = document.getElementById('navList');
  list.innerHTML = '';
  [...PAGES, {divider:true}, SETTINGS_PAGE].forEach(p => {
    if(p.divider){
      const li = document.createElement('li');
      li.style.cssText = 'height:1px;background:#D6D6D7;margin:8px 10px;';
      list.appendChild(li);
      return;
    }
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = (p.id === currentPage ? 'active ' : '') + (p.ready === false ? 'disabled' : '');
    a.innerHTML = icon(p.icon) + `<span>${p.label}</span>` + (p.ready === false ? '<span class="soon">soon</span>' : '');
    if(p.ready !== false){
      a.onclick = () => goTo(p.id);
    }
    li.appendChild(a);
    list.appendChild(li);
  });
}

function goTo(pageId){
  currentPage = pageId;
  renderNav();
  const searchInput = document.getElementById('pageSearchInput');
  if(searchInput) searchInput.value = '';
  render();
  updateSearchCount();
  document.getElementById('sidebar').classList.remove('open');
}

function fmtMoney(v){
  if(v === null || v === undefined || v === '') return '';
  return '$' + Number(v).toFixed(2);
}
function fmtHours(v){
  if(v === null || v === undefined || v === '') return '';
  return Number(v).toFixed(1);
}

/* ================================================================
   RENDER: PRICING GUIDE + SETTINGS share a table renderer
   ================================================================ */
function findLaborRate(id){
  return laborRateRows.find(r => r.id === id);
}

function computedLaborPrice(r){
  if(r.labor_rate_id){
    const rate = findLaborRate(r.labor_rate_id);
    if(rate && r.labor_hours != null) return r.labor_hours * rate.rate_amount;
  }
  return r.labor_price;
}

function computedTotalPrice(r){
  if(r.price_out) return null;
  if(r.labor_rate_id){
    const rate = findLaborRate(r.labor_rate_id);
    if(rate){
      const labor = r.labor_hours != null ? r.labor_hours * rate.rate_amount : 0;
      const parts = r.total_parts != null ? r.total_parts : 0;
      return labor + parts;
    }
  }
  return r.total_price;
}

function pricingTableHTML(editable){
  let prevMm = null;
  const rowsHtml = pricingRows.map(r => {
    if(r.row_type === 'header'){
      prevMm = null;
      return `<tr class="row-header"><td colspan="${editable?7:6}">${escapeHtml(r.description)}</td></tr>`;
    }
    if(r.row_type === 'note'){
      prevMm = null;
      const chip = r.mm_code ? `<span class="chip">${escapeHtml(r.mm_code)}</span> ` : '';
      const editCell = editable ? `<td class="actions-cell">${actionButtons(r.id)}</td>` : '';
      return `<tr class="row-note"><td colspan="6">${chip}${escapeHtml(r.description)}</td>${editCell}</tr>`;
    }
    const groupStart = r.mm_code && r.mm_code !== prevMm;
    if(r.mm_code) prevMm = r.mm_code;
    const mm = r.mm_code ? `<span class="chip">${escapeHtml(r.mm_code)}</span>` : '';
    const parts = r.price_out ? `<span class="chip chip-out">Price out</span>` : fmtMoney(r.total_parts);
    const editCell = editable ? `<td class="actions-cell">${actionButtons(r.id)}</td>` : '';
    return `<tr class="row-item${groupStart?' group-start':''}">
      <td class="mono">${mm}</td>
      <td>${escapeHtml(r.description)}${r.timing_type ? ` <span class="chip">${escapeHtml(r.timing_type)}</span>`:''}</td>
      <td class="num">${fmtHours(r.labor_hours)}</td>
      <td class="num">${fmtMoney(computedLaborPrice(r))}</td>
      <td class="num">${parts}</td>
      <td class="num total">${fmtMoney(computedTotalPrice(r))}</td>
      ${editCell}
    </tr>`;
  }).join('');

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>MM code</th><th>Description</th><th class="num">Labor hrs</th><th class="num">Labor $</th>
      <th class="num">Parts</th><th class="num">Total</th>
      ${editable?'<th class="num">Actions</th>':''}
    </tr></thead>
    <tbody>${rowsHtml || `<tr><td colspan="7" class="empty-hint">No rows yet. Add the first one.</td></tr>`}</tbody>
  </table></div>`;
}

function normalizeUrl(url){
  if(!url) return '';
  return /^https?:\/\//i.test(url) ? url : `https://${url}`;
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  }catch(e){
    alert('Could not copy — your browser may be blocking clipboard access.');
  }
}

function toggleWarrantyPassword(btn){
  const row = btn.closest('.warranty-cred-value');
  const span = row.querySelector('.warranty-password-mask');
  const isMasked = span.textContent.includes('•');
  span.textContent = isMasked ? span.dataset.value : '••••••••';
  btn.textContent = isMasked ? 'Hide' : 'Show';
}

function swimLaneBoardHTML(){
  const phases = [];
  lifecycleRows.forEach(r => { if(!phases.includes(r.phase)) phases.push(r.phase); });

  const byRolePhase = {};
  lifecycleRows.forEach(r => {
    const key = r.role + '|' + r.phase;
    if(!byRolePhase[key]) byRolePhase[key] = [];
    byRolePhase[key].push(r);
  });

  const rolesPresent = ROLE_ORDER.filter(role => lifecycleRows.some(r => r.role === role));

  const headerCells = phases.map(p => `<th class="board-phase-col">${escapeHtml(p)}</th>`).join('');
  const bodyRows = rolesPresent.map(role => {
    const cells = phases.map(phase => {
      const steps = byRolePhase[role + '|' + phase] || [];

      const chips = steps.map(s => `<div class="board-chip" style="--chip-color:${roleColor(role)}">${escapeHtml(s.step_text)}</div>`).join('<div class="board-chip-connector"></div>');

    return `<tr>
      <td class="board-role-col"><span class="role-badge" style="background:${roleColor(role)}">${escapeHtml(role)}</span></td>

  }).join('');

  return `<div class="table-wrap board-wrap"><table class="board-table">
    <thead><tr><th class="board-role-col">Role</th>${headerCells}</tr></thead>
    <tbody>${bodyRows || `<tr><td colspan="${phases.length+1}" class="empty-hint">No lifecycle steps yet.</td></tr>`}</tbody>

  const children = orgRows.filter(r => r.reports_to === emp.id);
  if(!children.length){
    return `<div class="org-tree-branch">${personCardHTML(emp)}</div>`;
  }

  // Group same-department siblings together. A group of 2+ with no
  // subordinates of their own renders as one compact vertical list
  // instead of spreading every person out as their own wide column —
  // keeps the tree from ballooning sideways under a big team.
  const groups = new Map();
  children.forEach(c => {
    if(!groups.has(c.department)) groups.set(c.department, []);
    groups.get(c.department).push(c);
  });

  const branchesHtml = Array.from(groups.entries()).map(([dept, members]) => {
    const hasGrandchildren = members.some(m => orgRows.some(r => r.reports_to === m.id));
    if(members.length > 1 && !hasGrandchildren){
      return departmentStackHTML(dept, members);

    return members.map(m => renderOrgSubtree(m)).join('');
  }).join('');

  return `<div class="org-tree-branch org-tree-has-children">
    ${personCardHTML(emp)}
    <div class="org-tree-connector-down"></div>
    <div class="org-tree-row">

const WEEKDAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function mondayOfWeek(date){
  const d = new Date(date);
  const dow = d.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function weekTypeForDate(date){
  const anchorRow = rotationAnchorRows[0];
  if(!anchorRow) return null;
  const anchorMonday = new Date(anchorRow.anchor_monday + 'T00:00:00');
  const monday = mondayOfWeek(date);
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const weeksDiff = Math.round((monday - anchorMonday) / msPerWeek);
  let idx = ((anchorRow.anchor_week_type - 1) + weeksDiff) % 3;
  idx = ((idx % 3) + 3) % 3;
  return idx + 1;
}

function offTechForDate(date){
  const dow = date.getDay();
  if(dow === 0) return null;
  const weekday = WEEKDAY_ABBR[dow];
  const wt = weekTypeForDate(date);
  if(!wt) return null;
  const row = rotationPatternRows.find(r => r.week_type === wt && r.weekday === weekday);
  return row ? row.off_tech_number : null;
}

function employeesWorkingOn(date){
  const dow = date.getDay();
  if(dow === 0) return [];
  const weekday = WEEKDAY_ABBR[dow];
  const offTech = offTechForDate(date);
  return orgRows.filter(e => {
    if(e.is_tbd) return false;
    if(e.tech_number) return e.tech_number !== offTech;
    return e.work_days && e.work_days.includes(weekday);
  });
}

function getMonthGrid(year, month){
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weeks = [];
  let week = new Array(6).fill(null);
  let anyInWeek = false;
  for(let d = 1; d <= daysInMonth; d++){
    const dow = new Date(year, month, d).getDay();
    if(dow === 0) continue;
    const col = dow - 1;
    week[col] = d;
    anyInWeek = true;
    if(col === 5){
      weeks.push(week);
      week = new Array(6).fill(null);
      anyInWeek = false;
    }
  }
  if(anyInWeek) weeks.push(week);
  return weeks;
}

function scheduleCalendarHTML(){
  const weeks = getMonthGrid(scheduleYear, scheduleMonth);
  const headCells = ['Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="schedule-head-cell">${d}</div>`).join('');
  const bodyCells = weeks.map(week => week.map(dayNum => {
    if(dayNum === null) return `<div class="schedule-day-cell schedule-day-empty"></div>`;
    const date = new Date(scheduleYear, scheduleMonth, dayNum);
    const isToday = isSameDate(date, new Date());
    const people = employeesWorkingOn(date).slice().sort((a,b) => DEPARTMENT_ORDER.indexOf(a.department) - DEPARTMENT_ORDER.indexOf(b.department));
    const peopleHtml = people.length
      ? people.map(p => `<div class="schedule-person"><span class="schedule-person-dot" style="background:${deptColor(p.department)}"></span>${escapeHtml(p.name)}</div>`).join('')
      : `<div class="schedule-none">No one scheduled</div>`;
    return `<div class="schedule-day-cell${isToday ? ' schedule-day-today' : ''}">
      <div class="schedule-date-num">${dayNum}</div>
      ${peopleHtml}
    </div>`;
  }).join('')).join('');

  return `<div class="schedule-grid-wrap"><div class="schedule-grid">${headCells}${bodyCells}</div></div>`;
}

function isSameDate(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function scheduleMonthLabel(){
  return `${MONTH_NAMES[scheduleMonth]} ${scheduleYear}`;
}

function prevScheduleMonth(){
  scheduleMonth--;
  if(scheduleMonth < 0){ scheduleMonth = 11; scheduleYear--; }
  render();
}
function nextScheduleMonth(){
  scheduleMonth++;
  if(scheduleMonth > 11){ scheduleMonth = 0; scheduleYear++; }
  render();
}
function goToScheduleToday(){
  const now = new Date();
  scheduleYear = now.getFullYear();
  scheduleMonth = now.getMonth();
  render();
}

/* ================================================================
   FIND ON PAGE (Ctrl+F style: highlights every match, scrolls to
   and steps through them, without touching the browser's own find)
   ================================================================ */
function getSearchScope(){
  return document.getElementById('main');
}

function clearHighlights(){
  const scope = getSearchScope();
  if(!scope) return;
  scope.querySelectorAll('mark.search-hit').forEach(m => {
    m.replaceWith(document.createTextNode(m.textContent));
  });
  scope.normalize();
  searchMatches = [];
  searchIndex = -1;
}

function runSearch(term){
  clearHighlights();
  const scope = getSearchScope();
  if(!scope || !term){ updateSearchCount(); return; }

  const re = new RegExp(escapeRegExp(term), 'gi');
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const textNodes = [];
  let n;
  while(n = walker.nextNode()) textNodes.push(n);

  textNodes.forEach(node => {
    const text = node.nodeValue;
    re.lastIndex = 0;
    if(!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    let m;
    while((m = re.exec(text)) !== null){
      if(m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      lastIndex = m.index + m[0].length;
      if(m[0].length === 0) re.lastIndex++;
    }
    if(lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    node.replaceWith(frag);
  });

  searchMatches = Array.from(scope.querySelectorAll('mark.search-hit'));
  searchIndex = searchMatches.length ? 0 : -1;
  highlightCurrentMatch();
  updateSearchCount();
}

function highlightCurrentMatch(){
  searchMatches.forEach((m, i) => m.classList.toggle('current', i === searchIndex));
  if(searchIndex >= 0){
    searchMatches[searchIndex].scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

function updateSearchCount(){
  const el = document.getElementById('searchCount');
  if(!el) return;
  const input = document.getElementById('pageSearchInput');
  if(searchMatches.length === 0){
    el.textContent = (input && input.value) ? '0 of 0' : '';
  } else {
    el.textContent = `${searchIndex + 1} of ${searchMatches.length}`;
  }
}

function onSearchInput(value){
  runSearch(value.trim());
}

function onSearchKeydown(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey) searchPrev(); else searchNext();
  } else if(e.key === 'Escape'){
    e.preventDefault();
    clearSearch();
    e.target.blur();
  }
}

function searchNext(){
  if(!searchMatches.length) return;
  searchIndex = (searchIndex + 1) % searchMatches.length;
  highlightCurrentMatch();
  updateSearchCount();
}

function searchPrev(){
  if(!searchMatches.length) return;
  searchIndex = (searchIndex - 1 + searchMatches.length) % searchMatches.length;
  highlightCurrentMatch();
  updateSearchCount();
}

function clearSearch(){
  clearHighlights();
  const input = document.getElementById('pageSearchInput');
  if(input) input.value = '';
  updateSearchCount();
}

function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Ctrl+F / Cmd+F focuses the in-app find bar instead of the browser's
// own find, but only on pages that actually have one — elsewhere the
// browser's native find still works untouched.
window.addEventListener('keydown', (e) => {
  const isFindShortcut = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f';
  if(!isFindShortcut) return;
  const input = document.getElementById('pageSearchInput');
  if(!input) return;
  e.preventDefault();
  input.focus();
  input.select();
});

async function handlePhotoFileSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  const preview = document.getElementById('photoPreview');
  preview.innerHTML = `<div class="photo-uploading">Uploading…</div>`;

  if(usingDemoDataOrg){
    const url = URL.createObjectURL(file);
    document.getElementById('o_photo_url').value = url;
    preview.innerHTML = `<img src="${url}" class="person-avatar" style="width:64px;height:64px;">`;
    return;
  }

  try{
    const formData = new FormData();
    formData.append('photo', file);
    const res = await fetch(`${CONFIG.API_BASE}/org/photo`, { method:'POST', body: formData });
    const data = await res.json();
    if(data.url){
      document.getElementById('o_photo_url').value = data.url;
      preview.innerHTML = `<img src="${data.url}" class="person-avatar" style="width:64px;height:64px;">`;
    } else {
      preview.innerHTML = `<div class="empty-hint" style="padding:0;">Upload failed</div>`;
    }
  }catch(e){
    preview.innerHTML = `<div class="empty-hint" style="padding:0;">Upload failed</div>`;
  }
}

          <option value="">— Custom / fixed rate —</option>
          ${laborRateRows.map(lr => `<option value="${lr.id}" ${r.labor_rate_id === lr.id ? 'selected':''}>${escapeHtml(lr.rate_name)} (${fmtMoney(lr.rate_amount)}/hr)</option>`).join('')}
        </select>
      </div>
      <div class="field" id="wrap_labor_price">
        <label>Labor price</label>
        <input type="number" step="0.01" id="f_labor_price" value="${r.labor_price ?? ''}">
      </div>
      <div class="field" id="wrap_labor_rate">
        <label>Labor rate</label>
        <input type="number" step="0.01" id="f_labor_rate" value="${r.labor_rate ?? ''}">
      </div>
      <div class="field">
        <label>Total parts</label>
        <input type="number" step="0.01" id="f_total_parts" value="${r.total_parts ?? ''}" onchange="toggleFieldVisibility()">
      </div>
      <div class="field" id="wrap_total_price">
        <label>Total price</label>
        <input type="number" step="0.01" id="f_total_price" value="${r.total_price ?? ''}">
      </div>
      <div class="field full" id="wrap_computed_preview">
        <label>Calculated (updates automatically when the rate changes)</label>
        <div class="computed-preview" id="computed_preview_text"></div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="f_price_out" ${r.price_out ? 'checked':''}>
        <label for="f_price_out">Price out (no fixed parts total — quoted at time of service)</label>
      </div>
    </div>
  `;
}

function toggleFieldVisibility(){
  const type = document.getElementById('f_row_type').value;
  document.getElementById('wrap_item_fields').style.display = type === 'item' ? 'grid' : 'none';
  document.getElementById('wrap_mm_code').style.display = type === 'header' ? 'none' : 'flex';
  if(type !== 'item') return;

  const rateIdEl = document.getElementById('f_labor_rate_id');
  const rateId = rateIdEl ? rateIdEl.value : '';
  const usingNamedRate = !!rateId;

  document.getElementById('wrap_labor_price').style.display = usingNamedRate ? 'none' : 'flex';
  document.getElementById('wrap_labor_rate').style.display = usingNamedRate ? 'none' : 'flex';
  document.getElementById('wrap_total_price').style.display = usingNamedRate ? 'none' : 'flex';
  document.getElementById('wrap_computed_preview').style.display = usingNamedRate ? 'flex' : 'none';

  if(usingNamedRate){
    const rate = laborRateRows.find(lr => lr.id === rateId);
    const hours = Number(document.getElementById('f_labor_hours').value) || 0;
    const parts = Number(document.getElementById('f_total_parts').value) || 0;
    const laborPrice = rate ? hours * rate.rate_amount : 0;
    const preview = document.getElementById('computed_preview_text');
    if(preview){
      preview.textContent = `Labor $${laborPrice.toFixed(2)} + Parts $${parts.toFixed(2)} = Total $${(laborPrice + parts).toFixed(2)}`;
    }
  }
}

async function saveRow(){
  const row_type = document.getElementById('f_row_type').value;
  const payload = {
    row_type,
    mm_code: type_or_null(document.getElementById('f_mm_code').value),
    description: document.getElementById('f_description').value.trim(),
  };
  if(row_type === 'item'){
    payload.timing_type = type_or_null(document.getElementById('f_timing_type').value);
    payload.labor_hours = numOrNull(document.getElementById('f_labor_hours').value);
    payload.total_parts = numOrNull(document.getElementById('f_total_parts').value);
    payload.price_out = document.getElementById('f_price_out').checked;

    const laborRateId = document.getElementById('f_labor_rate_id').value || null;
    payload.labor_rate_id = laborRateId;
    if(laborRateId){
      // Computed dynamically from the linked rate — don't store stale numbers.
      payload.labor_price = null;
      payload.labor_rate = null;
      payload.total_price = null;
    } else {
      payload.labor_price = numOrNull(document.getElementById('f_labor_price').value);
      payload.labor_rate = numOrNull(document.getElementById('f_labor_rate').value);
      payload.total_price = numOrNull(document.getElementById('f_total_price').value);
    }
  }
  if(!payload.description){
    alert('Description is required.');
    return;
  }

  if(editingId){
    Object.assign(pricingRows.find(r => r.id === editingId), payload);
    if(!usingDemoData){
      try{ await fetch(`${CONFIG.API_BASE}/pricing/${editingId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }catch(e){}
    }
  } else {
    const newRow = { id: 'local-' + Date.now(), sort_order: (pricingRows.at(-1)?.sort_order || 0) + 10, ...payload };
    pricingRows.push(newRow);
    if(!usingDemoData){
      try{ await fetch(`${CONFIG.API_BASE}/pricing`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newRow)}); }catch(e){}
    }
  }
  closeModal();
  render();
}

async function deleteRow(id){
  if(!confirm('Delete this row? This can\'t be undone.')) return;
  pricingRows = pricingRows.filter(r => r.id !== id);
  if(!usingDemoData){
    try{ await fetch(`${CONFIG.API_BASE}/pricing/${id}`, {method:'DELETE'}); }catch(e){}
  }
  render();
}

function type_or_null(v){ v = (v||'').trim(); return v === '' ? null : v; }
function numOrNull(v){ return v === '' || v === null || v === undefined ? null : Number(v); }
function escapeHtml(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
